[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pin-header-label-generator"
dynamic = ["version"]
description = "Printable pin-out labels for pin headers: push the pins through the paper and every signal name sits right next to its pin."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "shaag7967" }]
keywords = ["pin header", "pinout", "label", "electronics", "breadboard", "jumper wire", "arduino", "raspberry pi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Printing",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["PySide6-Essentials>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2", "twine>=6.1"]

[project.scripts]
pinlabel = "pin_header_label.cli:main"

[project.gui-scripts]
pinlabel-gui = "pin_header_label.gui.app:main"

[project.urls]
Homepage = "https://github.com/shaag7967/pinHeaderLabelGenerator"
Repository = "https://github.com/shaag7967/pinHeaderLabelGenerator"
Issues = "https://github.com/shaag7967/pinHeaderLabelGenerator/issues"

[tool.hatch.version]
path = "src/pin_header_label/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pin_header_label"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N"]
ignore = [
    "N802", # Qt event handlers use camelCase (paintEvent, wheelEvent, ...)
    "RUF001", # typographic quotes and the multiplication sign are intended in UI texts
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"src/pin_header_label/i18n/catalog_de.py" = ["E501"] # catalog keys must match the source text verbatim

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]
